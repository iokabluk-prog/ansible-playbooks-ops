---
- name: Setup Alertmanager on Ops for email alerts
  hosts: ops
  become: yes
  gather_facts: yes

  vars:
    alertmanager_version: "0.26.0"
    alertmanager_install_dir: "/usr/local/bin"
    alertmanager_config_dir: "/etc/alertmanager"
    alertmanager_data_dir: "/var/lib/alertmanager"
    email_to: "i27021985@mail.ru"
    email_from: "alertmanager@ops.local"
    smtp_host: "smtp.mail.ru"
    smtp_port: 465
    smtp_user: "i27021985@mail.ru"
    smtp_password: "jgKPy6JcAQJVaR28bY7S"  # Замените на реальный пароль приложения

  tasks:
    # ============================================================
    # 1. УСТАНОВКА ALERTMANAGER
    # ============================================================
    - name: Download Alertmanager
      get_url:
        url: "https://github.com/prometheus/alertmanager/releases/download/v{{ alertmanager_version }}/alertmanager-{{ alertmanager_version }}.linux-amd64.tar.gz"
        dest: /tmp/alertmanager.tar.gz
        timeout: 120
      register: download_result
      retries: 3
      delay: 10
      until: download_result is success

    - name: Create prometheus user (if not exists)
      user:
        name: prometheus
        system: yes
        shell: /sbin/nologin
        create_home: no
      ignore_errors: yes

    - name: Create Alertmanager directories
      file:
        path: "{{ item }}"
        state: directory
        owner: prometheus
        group: prometheus
        mode: '0755'
      loop:
        - "{{ alertmanager_config_dir }}"
        - "{{ alertmanager_data_dir }}"

    - name: Extract Alertmanager
      unarchive:
        src: /tmp/alertmanager.tar.gz
        dest: /tmp/
        remote_src: yes
        creates: "/tmp/alertmanager-{{ alertmanager_version }}.linux-amd64/alertmanager"

    - name: Install Alertmanager binary
      copy:
        src: "/tmp/alertmanager-{{ alertmanager_version }}.linux-amd64/alertmanager"
        dest: "{{ alertmanager_install_dir }}/alertmanager"
        mode: '0755'
        remote_src: yes

    - name: Install Alertmanager amtool
      copy:
        src: "/tmp/alertmanager-{{ alertmanager_version }}.linux-amd64/amtool"
        dest: "{{ alertmanager_install_dir }}/amtool"
        mode: '0755'
        remote_src: yes

    # ============================================================
    # 2. НАСТРОЙКА ALERTMANAGER (ИСПРАВЛЕННАЯ)
    # ============================================================
    - name: Create Alertmanager config
      copy:
        dest: "{{ alertmanager_config_dir }}/alertmanager.yml"
        content: |
          route:
            group_by: ['alertname', 'cluster', 'service']
            group_wait: 10s
            group_interval: 10s
            repeat_interval: 1h
            receiver: 'email-notifications'
            routes:
              - match:
                  severity: 'critical'
                receiver: 'email-notifications'
                continue: true
              - match:
                  severity: 'warning'
                receiver: 'email-notifications'
                continue: true

          receivers:
            - name: 'email-notifications'
              email_configs:
                - to: '{{ email_to }}'
                  from: '{{ email_from }}'
                  smarthost: '{{ smtp_host }}:{{ smtp_port }}'
                  auth_username: '{{ smtp_user }}'
                  auth_password: '{{ smtp_password }}'
                  send_resolved: true
                  headers:
                    Subject: '⚠️ ALERT: {{ "{{ .GroupLabels.alertname }}" }}'
                  html: |
                    <h2>⚠️ Alert Notification</h2>
                    <p><strong>Alert:</strong> {{ "{{ .GroupLabels.alertname }}" }}</p>
                    <p><strong>Severity:</strong> {{ "{{ .CommonLabels.severity }}" }}</p>
                    <p><strong>Status:</strong> {{ "{{ .Status }}" }}</p>
                    <p><strong>Description:</strong> {{ "{{ .CommonAnnotations.description }}" }}</p>
                    <p><strong>Summary:</strong> {{ "{{ .CommonAnnotations.summary }}" }}</p>
                    <hr>
                    <p><strong>Labels:</strong></p>
                    <ul>
                      {{ "{{ range $key, $value := .CommonLabels }}" }}
                        <li><strong>{{ "{{ $key }}" }}:</strong> {{ "{{ $value }}" }}</li>
                      {{ "{{ end }}" }}
                    </ul>
                    <hr>
                    <p><strong>Time:</strong> {{ "{{ .StartsAt.Format \"2006-01-02 15:04:05\" }}" }}</p>

          inhibit_rules:
            - source_match:
                severity: 'critical'
              target_match:
                severity: 'warning'
              equal: ['alertname', 'cluster']
        owner: prometheus
        group: prometheus
        mode: '0644'

    # ============================================================
    # 3. SYSTEMD SERVICE
    # ============================================================
    - name: Create Alertmanager systemd service
      copy:
        dest: /etc/systemd/system/alertmanager.service
        content: |
          [Unit]
          Description=Alertmanager
          After=network.target
          Documentation=https://prometheus.io/docs/alerting/latest/alertmanager/

          [Service]
          User=prometheus
          Group=prometheus
          Type=simple
          ExecStart={{ alertmanager_install_dir }}/alertmanager \
            --config.file={{ alertmanager_config_dir }}/alertmanager.yml \
            --storage.path={{ alertmanager_data_dir }} \
            --web.listen-address=:9093
          Restart=always

          [Install]
          WantedBy=multi-user.target
        mode: '0644'

    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Start and enable Alertmanager
      systemd:
        name: alertmanager
        state: started
        enabled: yes

    - name: Wait for Alertmanager to start
      wait_for:
        port: 9093
        timeout: 30

    - name: Allow Alertmanager port in UFW (if active)
      ufw:
        rule: allow
        port: '9093'
        proto: tcp
      ignore_errors: yes

    # ============================================================
    # 4. НАСТРОЙКА PROMETHEUS
    # ============================================================
    - name: Update Prometheus config with Alertmanager
      copy:
        dest: /etc/prometheus/prometheus.yml
        content: |
          global:
            scrape_interval: 15s
            evaluation_interval: 15s

          alerting:
            alertmanagers:
              - static_configs:
                  - targets: ['localhost:9093']

          rule_files:
            - /etc/prometheus/rules/*.rules

          scrape_configs:
            - job_name: 'prometheus'
              static_configs:
                - targets: ['localhost:9090']

            - job_name: 'node_ops'
              static_configs:
                - targets: ['localhost:9100']
                  labels:
                    instance: ops
                    role: monitoring

            - job_name: 'node_perimeter'
              static_configs:
                - targets: ['192.168.56.18:9100']
                  labels:
                    instance: perimeter
                    role: gateway

            - job_name: 'node_app_main'
              static_configs:
                - targets: ['192.168.56.20:9100']
                  labels:
                    instance: app-main
                    role: application

            - job_name: 'node_app_stby'
              static_configs:
                - targets: ['192.168.56.30:9100']
                  labels:
                    instance: app-stby
                    role: application

            - job_name: 'blackbox_http'
              metrics_path: /probe
              params:
                module: [http_2xx]
              static_configs:
                - targets:
                    - http://192.168.56.18
                    - http://192.168.56.20
                    - http://192.168.56.30
              relabel_configs:
                - source_labels: [__address__]
                  target_label: __param_target
                - source_labels: [__param_target]
                  target_label: instance
                - target_label: __address__
                  replacement: localhost:9115
        owner: prometheus
        group: prometheus
        mode: '0644'

    # ============================================================
    # 5. СОЗДАНИЕ ПРАВИЛ АЛЕРТОВ
    # ============================================================
    - name: Create alerts rules directory
      file:
        path: /etc/prometheus/rules
        state: directory
        owner: prometheus
        group: prometheus
        mode: '0755'

    - name: Create alerts rules file
      copy:
        dest: /etc/prometheus/rules/alerts.rules
        content: |
          groups:
            - name: server_alerts
              interval: 30s
              rules:
                - alert: ServerDown_Perimeter
                  expr: up{instance="perimeter"} == 0
                  for: 1m
                  labels:
                    severity: critical
                    service: perimeter
                  annotations:
                    summary: "Perimeter server is down"
                    description: "Perimeter server (192.168.56.18) has been unreachable for more than 1 minute."

                - alert: ServerDown_AppMain
                  expr: up{instance="app-main"} == 0
                  for: 1m
                  labels:
                    severity: critical
                    service: app-main
                  annotations:
                    summary: "App-Main server is down"
                    description: "App-Main server (192.168.56.20) has been unreachable for more than 1 minute."

                - alert: ServerDown_AppStby
                  expr: up{instance="app-stby"} == 0
                  for: 1m
                  labels:
                    severity: critical
                    service: app-stby
                  annotations:
                    summary: "App-Stby server is down"
                    description: "App-Stby server (192.168.56.30) has been unreachable for more than 1 minute."

                - alert: HTTPDown_Perimeter
                  expr: probe_success{job="blackbox_http", instance="http://192.168.56.18"} == 0
                  for: 1m
                  labels:
                    severity: critical
                    service: perimeter
                  annotations:
                    summary: "HTTP service on Perimeter is down"
                    description: "HTTP service on Perimeter (http://192.168.56.18) is not responding."

                - alert: HTTPDown_AppMain
                  expr: probe_success{job="blackbox_http", instance="http://192.168.56.20"} == 0
                  for: 1m
                  labels:
                    severity: critical
                    service: app-main
                  annotations:
                    summary: "HTTP service on App-Main is down"
                    description: "HTTP service on App-Main (http://192.168.56.20) is not responding."

                - alert: HTTPDown_AppStby
                  expr: probe_success{job="blackbox_http", instance="http://192.168.56.30"} == 0
                  for: 1m
                  labels:
                    severity: critical
                    service: app-stby
                  annotations:
                    summary: "HTTP service on App-Stby is down"
                    description: "HTTP service on App-Stby (http://192.168.56.30) is not responding."
        owner: prometheus
        group: prometheus
        mode: '0644'

    # ============================================================
    # 6. ПЕРЕЗАПУСК
    # ============================================================
    - name: Restart Prometheus
      systemd:
        name: prometheus
        state: restarted

    - name: Wait for Prometheus to start
      wait_for:
        port: 9090
        timeout: 30

    - name: Restart Alertmanager
      systemd:
        name: alertmanager
        state: restarted

    - name: Wait for Alertmanager to start
      wait_for:
        port: 9093
        timeout: 30

    # ============================================================
    # 7. ПРОВЕРКА
    # ============================================================
    - name: Check Alertmanager status
      command: systemctl status alertmanager --no-pager
      register: alertmanager_status
      changed_when: false

    - name: Check Alertmanager health
      uri:
        url: http://localhost:9093/-/healthy
        status_code: 200
      register: alertmanager_health

    - name: Display final status
      debug:
        msg: |
          ╔══════════════════════════════════════════════════════════════╗
          ║           ✅ ALERTMANAGER CONFIGURED SUCCESSFULLY!         ║
          ╚══════════════════════════════════════════════════════════════╝
          
          📊 Alertmanager: http://192.168.56.40:9093
          📊 Prometheus: http://192.168.56.40:9090
          
          📧 Email alerts will be sent to: {{ email_to }}
          
          📋 Alerts configured:
          - Server Down (perimeter, app-main, app-stby)
          - HTTP Service Down (perimeter, app-main, app-stby)
          
          ══════════════════════════════════════════════════════════════

    - name: Clean up
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/alertmanager.tar.gz
        - "/tmp/alertmanager-{{ alertmanager_version }}.linux-amd64"
