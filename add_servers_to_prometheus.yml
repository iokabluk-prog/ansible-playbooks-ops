---
- name: Add all servers to Prometheus monitoring
  hosts: ops
  become: yes
  gather_facts: yes

  tasks:
    # ============================================================
    # 1. ПРОВЕРКА, ЧТО NODE EXPORTERS РАБОТАЮТ НА ВСЕХ СЕРВЕРАХ
    # ============================================================
    - name: Check Node Exporter on Perimeter
      uri:
        url: http://192.168.56.18:9100/metrics
        status_code: 200
      register: perimeter_node
      ignore_errors: yes

    - name: Check Node Exporter on App-Main
      uri:
        url: http://192.168.56.20:9100/metrics
        status_code: 200
      register: main_node
      ignore_errors: yes

    - name: Check Node Exporter on App-Stby
      uri:
        url: http://192.168.56.30:9100/metrics
        status_code: 200
      register: stby_node
      ignore_errors: yes

    # ============================================================
    # 2. ОБНОВЛЕНИЕ КОНФИГА PROMETHEUS
    # ============================================================
    - name: Create Prometheus config with all servers
      copy:
        dest: /etc/prometheus/prometheus.yml
        content: |
          global:
            scrape_interval: 15s
            evaluation_interval: 15s

          alerting:
            alertmanagers:
              - static_configs:
                  - targets: []

          rule_files: []

          scrape_configs:
            # Prometheus self
            - job_name: 'prometheus'
              static_configs:
                - targets: ['localhost:9090']

            # Node Exporter - Ops
            - job_name: 'node_ops'
              static_configs:
                - targets: ['localhost:9100']
                  labels:
                    instance: ops
                    role: monitoring

            # Node Exporter - Perimeter
            - job_name: 'node_perimeter'
              static_configs:
                - targets: ['192.168.56.18:9100']
                  labels:
                    instance: perimeter
                    role: gateway

            # Node Exporter - App Main
            - job_name: 'node_app_main'
              static_configs:
                - targets: ['192.168.56.20:9100']
                  labels:
                    instance: app-main
                    role: application

            # Node Exporter - App Stby
            - job_name: 'node_app_stby'
              static_configs:
                - targets: ['192.168.56.30:9100']
                  labels:
                    instance: app-stby
                    role: application

            # MySQL Exporter - App Main
            - job_name: 'mysql_app_main'
              static_configs:
                - targets: ['192.168.56.20:9104']
                  labels:
                    instance: app-main
                    role: database

            # MySQL Exporter - App Stby
            - job_name: 'mysql_app_stby'
              static_configs:
                - targets: ['192.168.56.30:9104']
                  labels:
                    instance: app-stby
                    role: database

            # Blackbox Exporter - HTTP checks
            - job_name: 'blackbox_http'
              metrics_path: /probe
              params:
                module: [http_2xx]
              static_configs:
                - targets:
                    - http://192.168.56.18
                    - http://192.168.56.20
                    - http://192.168.56.30
              relabel_configs:
                - source_labels: [__address__]
                  target_label: __param_target
                - source_labels: [__param_target]
                  target_label: instance
                - target_label: __address__
                  replacement: localhost:9115
        owner: prometheus
        group: prometheus
        mode: '0644'
      notify: restart prometheus

    # ============================================================
    # 3. ПРОВЕРКА КОНФИГА
    # ============================================================
    - name: Check Prometheus config
      command: promtool check config /etc/prometheus/prometheus.yml
      register: check_config
      changed_when: false
      ignore_errors: yes

    - name: Show config check result
      debug:
        var: check_config.stdout_lines

    # ============================================================
    # 4. ПЕРЕЗАПУСК PROMETHEUS
    # ============================================================
    - name: Restart Prometheus
      systemd:
        name: prometheus
        state: restarted
      when: check_config.rc == 0

    - name: Wait for Prometheus to start
      wait_for:
        port: 9090
        timeout: 30

    # ============================================================
    # 5. ПРОВЕРКА TARGETS
    # ============================================================
    - name: Check Prometheus targets via API
      uri:
        url: http://localhost:9090/api/v1/targets
        return_content: yes
      register: targets_api

    - name: Display targets status
      debug:
        msg: |
          ╔══════════════════════════════════════════════════════════════╗
          ║           ✅ ALL SERVERS ADDED TO MONITORING!              ║
          ╚══════════════════════════════════════════════════════════════╝
          
          📊 Prometheus: http://192.168.56.40:9090
          📊 Targets: http://192.168.56.40:9090/targets
          
          📌 Добавлены серверы:
          - Perimeter (192.168.56.18:9100)
          - App-Main (192.168.56.20:9100)
          - App-Stby (192.168.56.30:9100)
          - MySQL App-Main (192.168.56.20:9104)
          - MySQL App-Stby (192.168.56.30:9104)
          - HTTP checks (blackbox)
          
          ══════════════════════════════════════════════════════════════

    # ============================================================
    # 6. УСТАНОВКА NODE EXPORTER НА СЕРВЕРА (ЕСЛИ НЕ УСТАНОВЛЕН)
    # ============================================================
    - name: Install Node Exporter on Perimeter
      block:
        - name: Download Node Exporter
          get_url:
            url: https://github.com/prometheus/node_exporter/releases/download/v1.7.0/node_exporter-1.7.0.linux-amd64.tar.gz
            dest: /tmp/node_exporter.tar.gz

        - name: Extract Node Exporter
          unarchive:
            src: /tmp/node_exporter.tar.gz
            dest: /tmp/
            remote_src: yes

        - name: Install Node Exporter
          copy:
            src: /tmp/node_exporter-1.7.0.linux-amd64/node_exporter
            dest: /usr/local/bin/node_exporter
            mode: '0755'
            remote_src: yes

        - name: Create Node Exporter service
          copy:
            dest: /etc/systemd/system/node_exporter.service
            content: |
              [Unit]
              Description=Node Exporter
              After=network.target

              [Service]
              User=prometheus
              Group=prometheus
              Type=simple
              ExecStart=/usr/local/bin/node_exporter --web.listen-address=:9100

              [Install]
              WantedBy=multi-user.target

        - name: Start Node Exporter
          systemd:
            name: node_exporter
            state: started
            enabled: yes
            daemon_reload: yes
      when: perimeter_node.status == -1
      delegate_to: perimeter

    - name: Install Node Exporter on App-Main
      block:
        - name: Download Node Exporter
          get_url:
            url: https://github.com/prometheus/node_exporter/releases/download/v1.7.0/node_exporter-1.7.0.linux-amd64.tar.gz
            dest: /tmp/node_exporter.tar.gz

        - name: Extract Node Exporter
          unarchive:
            src: /tmp/node_exporter.tar.gz
            dest: /tmp/
            remote_src: yes

        - name: Install Node Exporter
          copy:
            src: /tmp/node_exporter-1.7.0.linux-amd64/node_exporter
            dest: /usr/local/bin/node_exporter
            mode: '0755'
            remote_src: yes

        - name: Create Node Exporter service
          copy:
            dest: /etc/systemd/system/node_exporter.service
            content: |
              [Unit]
              Description=Node Exporter
              After=network.target

              [Service]
              User=prometheus
              Group=prometheus
              Type=simple
              ExecStart=/usr/local/bin/node_exporter --web.listen-address=:9100

              [Install]
              WantedBy=multi-user.target

        - name: Start Node Exporter
          systemd:
            name: node_exporter
            state: started
            enabled: yes
            daemon_reload: yes
      when: main_node.status == -1
      delegate_to: app-main

    - name: Install Node Exporter on App-Stby
      block:
        - name: Download Node Exporter
          get_url:
            url: https://github.com/prometheus/node_exporter/releases/download/v1.7.0/node_exporter-1.7.0.linux-amd64.tar.gz
            dest: /tmp/node_exporter.tar.gz

        - name: Extract Node Exporter
          unarchive:
            src: /tmp/node_exporter.tar.gz
            dest: /tmp/
            remote_src: yes

        - name: Install Node Exporter
          copy:
            src: /tmp/node_exporter-1.7.0.linux-amd64/node_exporter
            dest: /usr/local/bin/node_exporter
            mode: '0755'
            remote_src: yes

        - name: Create Node Exporter service
          copy:
            dest: /etc/systemd/system/node_exporter.service
            content: |
              [Unit]
              Description=Node Exporter
              After=network.target

              [Service]
              User=prometheus
              Group=prometheus
              Type=simple
              ExecStart=/usr/local/bin/node_exporter --web.listen-address=:9100

              [Install]
              WantedBy=multi-user.target

        - name: Start Node Exporter
          systemd:
            name: node_exporter
            state: started
            enabled: yes
            daemon_reload: yes
      when: stby_node.status == -1
      delegate_to: app-stby

  handlers:
    - name: restart prometheus
      systemd:
        name: prometheus
        state: restarted
        daemon_reload: yes
