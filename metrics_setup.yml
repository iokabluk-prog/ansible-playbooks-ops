---
- name: Setup metrics collection from all servers
  hosts: perimeter,app-main,app-stby
  become: yes
  gather_facts: yes

  tasks:
    # ============================================================
    # 1. УСТАНОВКА NODE EXPORTER НА ВСЕХ СЕРВЕРАХ
    # ============================================================
    - name: Download Node Exporter
      get_url:
        url: https://github.com/prometheus/node_exporter/releases/download/v1.7.0/node_exporter-1.7.0.linux-amd64.tar.gz
        dest: /tmp/node_exporter.tar.gz
      register: download_result
      retries: 3
      delay: 10
      until: download_result is success

    - name: Extract Node Exporter
      unarchive:
        src: /tmp/node_exporter.tar.gz
        dest: /tmp/
        remote_src: yes
        creates: /tmp/node_exporter-1.7.0.linux-amd64/node_exporter

    - name: Install Node Exporter binary
      copy:
        src: /tmp/node_exporter-1.7.0.linux-amd64/node_exporter
        dest: /usr/local/bin/node_exporter
        mode: '0755'
        remote_src: yes

    - name: Create prometheus user (if not exists)
      user:
        name: prometheus
        system: yes
        shell: /sbin/nologin
        create_home: no
      ignore_errors: yes

    - name: Create Node Exporter service
      copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Node Exporter
          After=network.target

          [Service]
          User=prometheus
          Group=prometheus
          Type=simple
          ExecStart=/usr/local/bin/node_exporter \
            --web.listen-address=:9100 \
            --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
          Restart=always

          [Install]
          WantedBy=multi-user.target
        mode: '0644'

    - name: Create textfile collector directory
      file:
        path: /var/lib/node_exporter/textfile_collector
        state: directory
        owner: prometheus
        group: prometheus
        mode: '0755'

    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Start and enable Node Exporter
      systemd:
        name: node_exporter
        state: started
        enabled: yes

    - name: Wait for Node Exporter to start
      wait_for:
        port: 9100
        timeout: 30

    - name: Check Node Exporter is running
      uri:
        url: http://localhost:9100/metrics
        return_content: yes
      register: metrics_check
      until: metrics_check.status == 200
      retries: 5
      delay: 2

    - name: Allow Node Exporter port in UFW (if active)
      ufw:
        rule: allow
        port: '9100'
        proto: tcp
      ignore_errors: yes

    - name: Clean up
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/node_exporter.tar.gz
        - /tmp/node_exporter-1.7.0.linux-amd64

- name: Configure Prometheus to collect metrics
  hosts: ops
  become: yes
  gather_facts: yes

  tasks:
    # ============================================================
    # 1. ОБНОВЛЕНИЕ КОНФИГА PROMETHEUS
    # ============================================================
    - name: Create Prometheus config with all servers
      copy:
        dest: /etc/prometheus/prometheus.yml
        content: |
          global:
            scrape_interval: 15s
            evaluation_interval: 15s

          alerting:
            alertmanagers:
              - static_configs:
                  - targets: []

          rule_files: []

          scrape_configs:
            # Prometheus self
            - job_name: 'prometheus'
              static_configs:
                - targets: ['localhost:9090']

            # Node Exporter - Ops
            - job_name: 'node_ops'
              static_configs:
                - targets: ['localhost:9100']
                  labels:
                    instance: ops
                    role: monitoring

            # Node Exporter - Perimeter
            - job_name: 'node_perimeter'
              static_configs:
                - targets: ['192.168.56.18:9100']
                  labels:
                    instance: perimeter
                    role: gateway

            # Node Exporter - App Main
            - job_name: 'node_app_main'
              static_configs:
                - targets: ['192.168.56.20:9100']
                  labels:
                    instance: app-main
                    role: application

            # Node Exporter - App Stby
            - job_name: 'node_app_stby'
              static_configs:
                - targets: ['192.168.56.30:9100']
                  labels:
                    instance: app-stby
                    role: application

            # MySQL Exporter - App Main
            - job_name: 'mysql_app_main'
              static_configs:
                - targets: ['192.168.56.20:9104']
                  labels:
                    instance: app-main
                    role: database

            # MySQL Exporter - App Stby
            - job_name: 'mysql_app_stby'
              static_configs:
                - targets: ['192.168.56.30:9104']
                  labels:
                    instance: app-stby
                    role: database

            # Blackbox Exporter - HTTP checks
            - job_name: 'blackbox_http'
              metrics_path: /probe
              params:
                module: [http_2xx]
              static_configs:
                - targets:
                    - http://192.168.56.18
                    - http://192.168.56.20
                    - http://192.168.56.30
              relabel_configs:
                - source_labels: [__address__]
                  target_label: __param_target
                - source_labels: [__param_target]
                  target_label: instance
                - target_label: __address__
                  replacement: localhost:9115
        owner: prometheus
        group: prometheus
        mode: '0644'
      notify: restart prometheus

    # ============================================================
    # 2. ПРОВЕРКА КОНФИГА
    # ============================================================
    - name: Check Prometheus config
      command: promtool check config /etc/prometheus/prometheus.yml
      register: check_config
      changed_when: false
      ignore_errors: yes

    - name: Show config check result
      debug:
        var: check_config.stdout_lines

    # ============================================================
    # 3. ПЕРЕЗАПУСК PROMETHEUS
    # ============================================================
    - name: Restart Prometheus
      systemd:
        name: prometheus
        state: restarted
      when: check_config.rc == 0

    - name: Wait for Prometheus to start
      wait_for:
        port: 9090
        timeout: 30

    # ============================================================
    # 4. ПРОВЕРКА TARGETS
    # ============================================================
    - name: Check Prometheus targets via API
      uri:
        url: http://localhost:9090/api/v1/targets
        return_content: yes
      register: targets_api

    - name: Display targets status
      debug:
        msg: |
          ╔══════════════════════════════════════════════════════════════╗
          ║           ✅ METRICS COLLECTION CONFIGURED!                ║
          ╚══════════════════════════════════════════════════════════════╝
          
          📊 Prometheus: http://192.168.56.40:9090
          📊 Targets: http://192.168.56.40:9090/targets
          
          📌 Сбор метрик настроен для:
          - Perimeter (192.168.56.18:9100)
          - App-Main (192.168.56.20:9100)
          - App-Stby (192.168.56.30:9100)
          - MySQL App-Main (192.168.56.20:9104)
          - MySQL App-Stby (192.168.56.30:9104)
          - HTTP checks (blackbox)
          
          ══════════════════════════════════════════════════════════════

  handlers:
    - name: restart prometheus
      systemd:
        name: prometheus
        state: restarted
        daemon_reload: yes
