- name: Install Prometheus from local archive
  hosts: ops
  become: yes
  gather_facts: yes
  
  tasks:
    - name: Check if archive exists
      stat:
        path: /tmp/prometheus-2.47.0.linux-amd64.tar.gz
      register: archive_file

    - name: Fail if archive not found
      fail:
        msg: "Archive /tmp/prometheus.tar.gz not found on ops server"
      when: not archive_file.stat.exists

    - name: Create prometheus user
      user:
        name: prometheus
        system: yes
        shell: /sbin/nologin
        create_home: no
      ignore_errors: yes

    - name: Create prometheus directories
      file:
        path: "{{ item }}"
        state: directory
        owner: prometheus
        group: prometheus
        mode: '0755'
      loop:
        - /etc/prometheus
        - /var/lib/prometheus
        - /var/log/prometheus

    - name: Extract Prometheus archive
      unarchive:
        src: /tmp/prometheus-2.47.0.linux-amd64.tar.gz
        dest: /tmp/
        remote_src: yes
        creates: /tmp/prometheus-2.47.0.linux-amd64/prometheus

    - name: Find extracted directory
      find:
        paths: /tmp
        patterns: "prometheus-*.linux-amd64"
        file_type: directory
      register: extracted_dir

    - name: Set extracted directory variable
      set_fact:
        prometheus_dir: "{{ extracted_dir.files[0].path }}"
      when: extracted_dir.files | length > 0

    - name: Install Prometheus binaries
      copy:
        src: "{{ prometheus_dir }}/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        mode: '0755'
        remote_src: yes
      loop:
        - prometheus
        - promtool
      when: extracted_dir.files | length > 0

    - name: Install Prometheus consoles
      copy:
        src: "{{ prometheus_dir }}/consoles/"
        dest: /etc/prometheus/consoles/
        remote_src: yes
        directory_mode: yes
      when: extracted_dir.files | length > 0

    - name: Install Prometheus console_libraries
      copy:
        src: "{{ prometheus_dir }}/console_libraries/"
        dest: /etc/prometheus/console_libraries/
        remote_src: yes
        directory_mode: yes
      when: extracted_dir.files | length > 0

    - name: Set ownership
      file:
        path: /etc/prometheus
        owner: prometheus
        group: prometheus
        recurse: yes

    - name: Create Prometheus config
      copy:
        dest: /etc/prometheus/prometheus.yml
        content: |
          global:
            scrape_interval: 15s
            evaluation_interval: 15s
          
          alerting:
            alertmanagers:
              - static_configs:
                  - targets: []
          
          rule_files: []
          
          scrape_configs:
            - job_name: 'prometheus'
              static_configs:
                - targets: ['localhost:9090']
            - job_name: 'node_exporter'
              static_configs:
                - targets: ['localhost:9100']
        owner: prometheus
        group: prometheus
        mode: '0644'

    - name: Create Prometheus systemd service
      copy:
        dest: /etc/systemd/system/prometheus.service
        content: |
          [Unit]
          Description=Prometheus
          After=network.target

          [Service]
          User=prometheus
          Group=prometheus
          Type=simple
          ExecStart=/usr/local/bin/prometheus \
            --config.file=/etc/prometheus/prometheus.yml \
            --storage.tsdb.path=/var/lib/prometheus \
            --web.listen-address=:9090
          Restart=always

          [Install]
          WantedBy=multi-user.target
        mode: '0644'

    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Enable and start Prometheus
      systemd:
        name: prometheus
        state: started
        enabled: yes

    - name: Wait for Prometheus to start
      wait_for:
        port: 9090
        timeout: 30

    - name: Check Prometheus status
      command: systemctl status prometheus --no-pager
      register: prometheus_status
      changed_when: false

    - name: Display Prometheus status
      debug:
        msg: "{{ prometheus_status.stdout_lines }}"

    - name: Check Prometheus metrics
      uri:
        url: http://localhost:9090/metrics
        return_content: yes
      register: metrics
      until: metrics.status == 200
      retries: 5
      delay: 2

    - name: Display success message
      debug:
        msg: |
          ╔══════════════════════════════════════════════════════════════╗
          ║           ✅ PROMETHEUS INSTALLED SUCCESSFULLY!            ║
          ╚══════════════════════════════════════════════════════════════╝
          
          📊 Prometheus: http://192.168.56.40:9090
          📊 Metrics: http://192.168.56.40:9090/metrics
          
          ══════════════════════════════════════════════════════════════

    - name: Install Node Exporter
      block:
        - name: Download Node Exporter
          get_url:
            url: https://github.com/prometheus/node_exporter/releases/download/v1.7.0/node_exporter-1.7.0.linux-amd64.tar.gz
            dest: /tmp/node_exporter.tar.gz

        - name: Extract Node Exporter
          unarchive:
            src: /tmp/node_exporter.tar.gz
            dest: /tmp/
            remote_src: yes

        - name: Install Node Exporter
          copy:
            src: /tmp/node_exporter-1.7.0.linux-amd64/node_exporter
            dest: /usr/local/bin/node_exporter
            mode: '0755'
            remote_src: yes

        - name: Create Node Exporter service
          copy:
            dest: /etc/systemd/system/node_exporter.service
            content: |
              [Unit]
              Description=Node Exporter
              After=network.target

              [Service]
              User=prometheus
              Group=prometheus
              Type=simple
              ExecStart=/usr/local/bin/node_exporter --web.listen-address=:9100

              [Install]
              WantedBy=multi-user.target

        - name: Start Node Exporter
          systemd:
            name: node_exporter
            state: started
            enabled: yes
            daemon_reload: yes

      when: false  # Отключено, если не нужно

    - name: Clean up
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/prometheus.tar.gz
        - /tmp/prometheus-2.47.0.linux-amd64
