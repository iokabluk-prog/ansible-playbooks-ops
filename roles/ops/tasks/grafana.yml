---
- name: Install Grafana from .deb package
  tags: grafana
  block:
    - name: Download Grafana .deb package
      get_url:
        url: https://dl.grafana.com/oss/release/grafana_9.5.2_amd64.deb
        dest: /tmp/grafana.deb
      tags: grafana

    - name: Install Grafana
      apt:
        deb: /tmp/grafana.deb
        state: present
      tags: grafana

    - name: Start Grafana
      systemd:
        name: grafana-server
        state: started
        enabled: yes
      tags: grafana

    - name: Configure Grafana datasource
      copy:
        dest: /etc/grafana/provisioning/datasources/prometheus.yml
        content: |
          apiVersion: 1
          datasources:
            - name: Prometheus
              type: prometheus
              access: proxy
              url: http://localhost:9090
              isDefault: true
      tags: grafana
