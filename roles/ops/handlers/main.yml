---
# Handlers for Ops role

- name: restart prometheus
  systemd:
    name: prometheus
    state: restarted
    daemon_reload: yes

- name: restart grafana
  systemd:
    name: grafana-server
    state: restarted
    daemon_reload: yes

- name: restart nginx
  systemd:
    name: nginx
    state: restarted
    daemon_reload: yes

- name: restart fluent-bit
  systemd:
    name: fluent-bit
    state: restarted
    daemon_reload: yes

- name: restart loki
  systemd:
    name: loki
    state: restarted
    daemon_reload: yes

- name: reload prometheus
  systemd:
    name: prometheus
    state: reloaded
